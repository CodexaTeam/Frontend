<div class="auth-container">
  <div class="auth-card">
    <h2>{{ 'REGISTER.TITLE' | translate }}</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="name">{{ 'REGISTER.FULL_NAME' | translate }}</label>
        <input type="text" id="name" formControlName="name" required>
      </div>

      <div class="form-group">
        <label for="email">{{ 'REGISTER.EMAIL' | translate }}</label>
        <input type="email" id="email" formControlName="email" required>
      </div>

      <div class="form-group">
        <label for="password">{{ 'REGISTER.PASSWORD' | translate }}</label>
        <input type="password" id="password" formControlName="password" required>
      </div>

      <div class="form-group">
        <label>{{ 'REGISTER.ROLE_PROMPT' | translate }}</label>
        <div class="role-options">
          <label>
            <input type="radio" value="arrendatario" formControlName="role">
            {{ 'REGISTER.RENTER' | translate }}
          </label>
          <label>
            <input type="radio" value="arrendador" formControlName="role">
            {{ 'REGISTER.OWNER' | translate }}
          </label>
        </div>
      </div>

      <button type="submit" class="auth-button" [disabled]="registerForm.invalid">
        {{ 'REGISTER.BUTTON' | translate }}
      </button>

      <div class="switch-link">
        {{ 'REGISTER.HAVE_ACCOUNT' | translate }} <a routerLink="/login">{{ 'REGISTER.LOGIN' | translate }}</a>
      </div>
    </form>
  </div>
</div>
